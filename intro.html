<ul style="font-size:28px;line-height:1.45;color:#4A5866">
<li>Decision trees, random forests, SVMs, logistic regression</li>
<li>Show it 50,000 cats vs. dogs, or 100,000 spam vs. not-spam, and it learns to classify</li>
<li><b style="color:#16202B">Limit:</b> completely rigid. A spam filter can’t write a sentence.</li>
</ul>

<ul style="font-size:28px;line-height:1.45;color:#4A5866">
<li>Google’s 2017 paper <i>“Attention Is All You Need”</i></li>
<li>Self-attention: every token weighs every other token, near or far</li>
<li>Trained only to predict the <b style="color:#16202B">next token</b>, models picked up grammar and world knowledge</li>
<li>Foundation models: GPT-3, PaLM, LLaMA</li>

<script>
  const fit = () => document.querySelectorAll('.scaler').forEach(el => el.style.setProperty('--s', el.clientWidth / 1920));
  new ResizeObserver(fit).observe(document.querySelector('main'));
  fit();
  const frames = [...document.querySelectorAll('.frame')];
  addEventListener('keydown', e => {
    const step = {ArrowRight: 1, ArrowDown: 1, PageDown: 1, ' ': 1, ArrowLeft: -1, ArrowUp: -1, PageUp: -1}[e.key];
    if (!step) return;
    e.preventDefault();
    const mid = innerHeight / 2;
    let cur = frames.findIndex(f => f.getBoundingClientRect().bottom > mid);
    if (cur < 0) cur = frames.length - 1;
    frames[Math.max(0, Math.min(frames.length - 1, cur + step))].scrollIntoView({behavior: 'smooth', block: 'center'});
  });
